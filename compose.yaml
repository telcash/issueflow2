services:

  app:
    build:
      context: . # El Dockerfile con las instrucciones para construir este contenedor está en el mismo directorio que este archivo
    
    container_name: issueflow_app # nombre del contenedor

    ports:
      - "8000:80" # 8000 es el puerto del ordenador host, y 80 el interno del contenedor
    
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: mi_super_secreto
      DATABASE_URL: "mysql://issueflow:issueflow_pass@db:3306/issueflow?serverVersion=8.4.0&charset=utf8mb4"

    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: mysql:8.4 # Usa la imagen oficial de MySQL 8.4, a diferencia de app aquí no se construye una imagen propia

    container_name: issueflow_db

    environment:
      MYSQL_DATABASE: issueflow
      MYSQL_USER: issueflow
      MYSQL_PASSWORD: issueflow_pass
      MYSQL_ROOT_PASSWORD: root_pass
    
    ports:
      - "3307:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql # Guarda los archivos de MySQL en un volumen persistente
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data: