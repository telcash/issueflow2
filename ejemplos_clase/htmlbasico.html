<!DOCTYPE html>
<!-- Comienza el documento HTML, con la etiqueta raíz, con el atributo lang="en" -->
<html lang="en">
<!-- Comienza la sección de encabezado del documento, aquí se incluyen los metadatos del documento -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title contiene el título del documento, que se muestra en la pestaña del navegador -->
    <title>Document</title>
</head>
<!-- Comienza la sección del cuerpo del documento, aquí se incluye el contenido visible del documento -->
<body>
    <!-- En el header puedo encontrar el logo, la barra de navegación y otros elementos del encabezado -->
    <header>
        <!-- Se usa la etiqueta nav para crear una barra de navegación -->
        <nav>
            <!-- La etiqueta ul crea una lista no ordenada -->
            <ul>
                <!-- Cada li representa un elemento de la lista -->
                <!-- La etiqueta a crea un enlace, el atributo href indica la URL a la que apunta el enlace -->
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <!-- La etiqueta main representa el contenido principal del documento -->
    <main>
        <!-- La etiqueta section representa una sección del documento -->
        <section>
            <!-- La etiqueta h1 representa un encabezado de nivel 1, que es el título principal de la sección -->
            <h1>Bienvenido a mi sitio web</h1>
            <!-- La etiqueta p representa un párrafo -->
            <p>Este es un ejemplo de un documento HTML básico.</p>
            <!-- La etiqueta img representa una imagen, el atributo src indica la URL de la imagen, y el atributo alt proporciona un texto alternativo para la imagen -->
            <img src="https://via.placeholder.com/150" alt="Imagen de ejemplo">
            <!-- La etiqueta div es un contenedor genérico que se puede usar para agrupar otros elementos -->
            <div>
                <p>Este es un párrafo dentro de un div.</p>
                <!-- La etiqueta button representa un botón que se puede hacer clic -->
                <button>Haz clic aquí</button>
            </div>
        </section>
    </main>
    <!-- La etiqueta footer representa el pie de página del documento -->
    <footer>
        <p>&copy; 2024 Mi sitio web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
